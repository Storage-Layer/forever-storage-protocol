# FSP Phase 5 Production Coordinator Daemon Configuration
[coordinator]
coordinator_id = "coordinator-1"
metadata_root = "/var/lib/fsp/coordinator"
placement_policy = "FailureDomainStrict"
max_shards_per_host = 4
max_shards_per_rack = 10
default_coding_scheme = "RS(20,12)"
default_stripe_size_bytes = 4194304
degraded_commit_policy = "TolerateMaxErasures"

[security]
trust_environment_mode = "ProductionStrict"
ca_cert_pem = "/etc/fsp/pki/ca.crt"
coordinator_cert_pem = "/etc/fsp/pki/coordinator.crt"
coordinator_key_pem = "/etc/fsp/pki/coordinator.key"
ed25519_manifest_signer_key_file = "/etc/fsp/pki/manifest_signer.key"

[repair_and_scrub]
heartbeat_interval_secs = 2
scrub_max_verifications_per_cycle = 100
effective_repair_bandwidth_bps = 104857600

# 5-Host Physical Topology: 4 nodes per host = 20 nodes total
[[nodes]]
node_id = 1
identity_id = "node-alpha-1"
listen_addr = "10.0.1.11:19401"
host_domain = "host-alpha"
disk_domain = "disk-01"
rack_domain = "rack-1"
region_domain = "region-eu-1"

