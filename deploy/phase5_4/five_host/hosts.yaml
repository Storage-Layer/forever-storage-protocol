# FSP Five-Host Deployment Configuration (Canonical 5-Zone Model)
cluster_name: fsp-production-5host
replication_profile: rs-20-12
failure_domain_guarantee: "Any 2 entire host failures (8 nodes) leaves 12 shards alive, guaranteeing 100% data recovery"

hosts:
  storage-host-01:
    ip: 10.0.10.11
    zone_id: 0
    coordinator: coord-0 (port 9000)
    nodes:
