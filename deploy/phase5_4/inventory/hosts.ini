# Ansible / Deployment Inventory for FSP Physical Multi-Host Cluster

[coordinators]
coord-01 ansible_host=10.0.10.11 node_id=0
coord-02 ansible_host=10.0.10.12 node_id=1
coord-03 ansible_host=10.0.10.13 node_id=2

[zone_0]
host-01 ansible_host=10.0.10.11 zone=0 nodes_count=4

[zone_1]
host-02 ansible_host=10.0.10.12 zone=1 nodes_count=4

[zone_2]
host-03 ansible_host=10.0.10.13 zone=2 nodes_count=4

[zone_3]
host-04 ansible_host=10.0.10.14 zone=3 nodes_count=4

[zone_4]
host-05 ansible_host=10.0.10.15 zone=4 nodes_count=4

[storage_cluster:children]
zone_0
zone_1
zone_2
zone_3
zone_4

[fsp_cluster:children]
coordinators
storage_cluster

[fsp_cluster:vars]
ansible_user=fsp-admin
ansible_ssh_private_key_file=~/.ssh/fsp_deploy_key
fsp_bin_path=/opt/fsp/bin/fsp-node
fsp_config_path=/etc/fsp
fsp_data_root=/data/fsp
fsp_tls_ca=/etc/fsp/tls/ca.crt
fsp_release_version=0.5.4
