# FSP Phase 5.1 - 5-Host Physical Staging Configuration
# Enforces RS(20,12) distributed placement with <= 4 shards per host failure domain

coordinator_id = "coord-primary"
cluster_name = "fsp-prod-staging"
listen_addr = "127.0.0.1:18000"
voter_quorum_size = 5
voter_majority_threshold = 3
data_shards_k = 12
parity_shards_m = 8
max_shards_per_host = 4
max_shards_per_rack = 8
default_coding_scheme = "RS(20,12)"
default_stripe_size_bytes = 4194304
degraded_commit_policy = "TolerateMaxErasures"
ca_cert_pem = "deploy/phase5_1/certs/ca.crt"
coordinator_cert_pem = "deploy/phase5_1/certs/coord.crt"
coordinator_key_pem = "deploy/phase5_1/certs/coord.key"
manifest_signer_key_file = "deploy/phase5_1/certs/manifest_signer.key"
heartbeat_interval_secs = 2
scrub_max_verifications_per_cycle = 100
effective_repair_bandwidth_bps = 104857600

# 20 storage nodes distributed across 5 host failure domains (4 nodes per host)
[[nodes]]
node_id = 1
identity_id = "node-01"
listen_addr = "127.0.0.1:19001"
host_domain = "host-01"
disk_domain = "disk-01"
rack_domain = "rack-01"
region_domain = "region-primary"

