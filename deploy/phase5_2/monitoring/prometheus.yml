global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "prometheus_alerts.yml"

scrape_configs:
  - job_name: "fsp_coordinator"
    static_configs:
      - targets: ["localhost:9100"]

  - job_name: "fsp_nodes"
    static_configs:
      - targets:
          - "localhost:9201"
          - "localhost:9202"
          - "localhost:9203"
